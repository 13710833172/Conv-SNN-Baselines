<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="590" viewBox="0 0 1260 590" role="img" aria-labelledby="title desc">
<title id="title">Multi-step convolutional SNN for MNIST and CIFAR-10</title>
<desc id="desc">Four static repetitions feed a spiking convolutional encoder. MNIST uses 1 to 64 to 128 channels and two pooled stages; CIFAR-10 uses 3 to 64 to 64 to 128 to 128 channels and two pooling operations. The flattened features pass through a 256-unit spiking hidden layer and a ten-class spiking output, averaged over four time steps.</desc>
<rect width="1260" height="590" fill="#fff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#697887"/></marker></defs>
<g font-family="Arial,Helvetica,sans-serif" fill="#183244">
<text x="34" y="43" font-size="25" font-weight="700">Multi-step convolutional spiking classifiers</text>
<text x="34" y="71" font-size="16" fill="#526676">Static repetition: x(t) = x, t = 1, 2, 3, 4     |     Each Conv block = 3×3 Conv + BN + LIF</text>
<rect x="25" y="104" width="1210" height="191" rx="8" fill="#f5f9fc" stroke="#c6d8e4"/>
<text x="48" y="137" font-size="20" font-weight="700">MNIST</text>
<rect x="45" y="161" width="159" height="81" rx="7" fill="#e4eef8" stroke="#578db4"/><text x="124" y="193" text-anchor="middle" font-size="16" font-weight="700">Input</text><text x="124" y="218" text-anchor="middle" font-size="14">1 × 28 × 28</text>
<rect x="256" y="161" width="182" height="81" rx="7" fill="#e5f3f0" stroke="#4a9b8d"/><text x="347" y="192" text-anchor="middle" font-size="16" font-weight="700">Conv–BN–LIF</text><text x="347" y="218" text-anchor="middle" font-size="14">64 × 28 × 28</text>
<rect x="490" y="161" width="126" height="81" rx="7" fill="#eaf0fb" stroke="#6a88b6"/><text x="553" y="192" text-anchor="middle" font-size="16" font-weight="700">MaxPool</text><text x="553" y="218" text-anchor="middle" font-size="14">64 × 14 × 14</text>
<rect x="668" y="161" width="184" height="81" rx="7" fill="#e5f3f0" stroke="#4a9b8d"/><text x="760" y="192" text-anchor="middle" font-size="16" font-weight="700">Conv–BN–LIF</text><text x="760" y="218" text-anchor="middle" font-size="14">128 × 14 × 14</text>
<rect x="905" y="161" width="280" height="81" rx="7" fill="#eaf0fb" stroke="#6a88b6"/><text x="1045" y="192" text-anchor="middle" font-size="16" font-weight="700">MaxPool + Flatten</text><text x="1045" y="218" text-anchor="middle" font-size="14">128 × 7 × 7 → 6272</text>
<rect x="25" y="315" width="1210" height="161" rx="8" fill="#f5f9fc" stroke="#c6d8e4"/>
<text x="48" y="347" font-size="20" font-weight="700">CIFAR-10</text>
<rect x="45" y="363" width="175" height="78" rx="7" fill="#e4eef8" stroke="#578db4"/><text x="132" y="394" text-anchor="middle" font-size="16" font-weight="700">Input</text><text x="132" y="419" text-anchor="middle" font-size="14">3 × 32 × 32</text>
<rect x="272" y="363" width="250" height="78" rx="7" fill="#e5f3f0" stroke="#4a9b8d"/><text x="397" y="394" text-anchor="middle" font-size="16" font-weight="700">Conv–LIF × 2</text><text x="397" y="419" text-anchor="middle" font-size="14">64 × 32 × 32 → Pool 16 × 16</text>
<rect x="574" y="363" width="295" height="78" rx="7" fill="#e5f3f0" stroke="#4a9b8d"/><text x="721" y="394" text-anchor="middle" font-size="16" font-weight="700">Conv–LIF × 2</text><text x="721" y="419" text-anchor="middle" font-size="14">128 × 16 × 16 → Pool 8 × 8</text>
<rect x="921" y="363" width="264" height="78" rx="7" fill="#eaf0fb" stroke="#6a88b6"/><text x="1053" y="394" text-anchor="middle" font-size="16" font-weight="700">Flatten</text><text x="1053" y="419" text-anchor="middle" font-size="14">128 × 8 × 8 → 8192</text>
<rect x="225" y="511" width="810" height="55" rx="8" fill="#e4eef8" stroke="#578db4"/>
<text x="630" y="535" text-anchor="middle" font-size="16" font-weight="700">Shared head: Dropout → Linear(256) → LIF → Dropout → Linear(10) → LIF</text>
<text x="630" y="553" text-anchor="middle" font-size="13">Temporal mean of output spikes → 10 class scores</text>
</g><g stroke="#697887" stroke-width="2" marker-end="url(#arr)"><path d="M207 201H251"/><path d="M441 201H485"/><path d="M619 201H663"/><path d="M855 201H900"/><path d="M223 402H267"/><path d="M525 402H569"/><path d="M872 402H916"/><path d="M630 476V505"/></g></svg>